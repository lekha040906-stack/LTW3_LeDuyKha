spring.application.name=order-service
server.port=8082

# Cấu hình kết nối SQL Server (Đọc SQLSERVER_PASSWORD từ file .env qua spring-dotenv)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=order_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SQLSERVER_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate JPA tự động tạo/cập nhật bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
